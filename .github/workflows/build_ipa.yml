name: Build GhostRunner iOS 18+ Clean IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Compile & Package GhostRunner.ipa
    runs-on: macos-14  # Apple Silicon M1 Runner with Xcode 15/16 and iOS 18 SDK
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Inspect Environment & Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Compile WebDriverAgentRunner with Ad-Hoc Signing
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Assemble & Deep Sign Clean IPA
        run: |
          mkdir -p Payload
          RUNNER_APP=$(find ./build -name "WebDriverAgentRunner-Runner.app" -type d | head -n 1)
          if [ -z "$RUNNER_APP" ]; then
            echo "[-] Error: WebDriverAgentRunner-Runner.app not found!"
            exit 1
          fi
          echo "[+] Found compiled app bundle at: $RUNNER_APP"
          cp -R "$RUNNER_APP" Payload/
          
          # Crucial: Deep ad-hoc sign every binary so that dyld mapped file cdhash checks pass 100% on iOS!
          echo "[*] Applying deep ad-hoc codesigning to all binaries and plugins..."
          find Payload -name "*.dylib" -exec codesign --force --sign - {} \; || true
          find Payload -name "*.framework" -exec codesign --force --sign - {} \; || true
          find Payload -name "*.xctest" -exec codesign --force --deep --sign - {} \; || true
          find Payload -name "*.app" -exec codesign --force --deep --sign - {} \; || true
          
          echo "[*] Verifying nested xctest signature:"
          codesign -dvv Payload/WebDriverAgentRunner-Runner.app/PlugIns/WebDriverAgentRunner.xctest || true

          # Compress into IPA archive preserving symlinks
          zip -r -y GhostRunner_iOS18.ipa Payload
          echo "[OK] GhostRunner_iOS18.ipa assembled with valid cdhash!"
          ls -lh GhostRunner_iOS18.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostRunner_iOS18_Clean
          path: GhostRunner_iOS18.ipa
          if-no-files-found: error
